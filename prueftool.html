<style>

* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); font-size:15px; }
.header { background:var(--bg2); border-bottom:2px solid var(--accent); padding:10px 20px; display:flex; justify-content:space-between; align-items:center; }
.header h1 { font-size:18px; } .header h1 span { color:var(--accent); }
.stats { display:flex; gap:12px; font-size:13px; }
.stat { padding:4px 12px; border-radius:8px; font-weight:600; }
.stat-ok { background:rgba(34,197,94,0.15); color:var(--green); }
.stat-err { background:rgba(239,68,68,0.15); color:var(--red); }
.stat-all { background:rgba(14,165,233,0.15); color:var(--accent2); }
.container { max-width:900px; margin:0 auto; padding:16px; }
.nav { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
.nav button { padding:8px 16px; border:none; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; }
.btn-prev { background:var(--bg3); color:var(--text); }
.btn-next { background:var(--accent2); color:#fff; }
.btn-save { background:var(--green); color:#000; }
.btn-export { background:var(--accent); color:#fff; }
.nav select { padding:8px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; font-size:14px; }
.pos-info { font-size:14px; color:var(--text2); }
.card { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; }
.card.ok { border-left:4px solid var(--green); }
.card.err { border-left:4px solid var(--red); }
.card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.card-title { font-size:16px; font-weight:700; }
.card-badge { padding:3px 10px; border-radius:6px; font-size:12px; font-weight:600; }
.badge-ok { background:rgba(34,197,94,0.2); color:var(--green); }
.badge-err { background:rgba(239,68,68,0.2); color:var(--red); }
.badge-fixed { background:rgba(14,165,233,0.2); color:var(--accent2); }
.field-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.field { display:flex; flex-direction:column; }
.field label { font-size:11px; color:var(--text2); font-weight:600; text-transform:uppercase; margin-bottom:3px; }
.field input { padding:8px 10px; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:6px; font-size:14px; }
.field input:focus { outline:none; border-color:var(--accent2); box-shadow:0 0 0 2px rgba(14,165,233,0.3); }
.field input.changed { border-color:var(--orange); background:rgba(245,158,11,0.1); }
.field-wide { grid-column:1/-1; }
.links { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
.links a { font-size:12px; padding:4px 10px; border-radius:4px; text-decoration:none; color:#fff; }
.link-amz { background:#f59e0b; }
.link-kl { background:var(--accent); }
.link-a1 { background:var(--accent2); }
.save-status { font-size:12px; margin-left:8px; }
.log { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px; margin-top:12px; max-height:200px; overflow-y:auto; font-size:12px; }
.log-entry { padding:3px 0; border-bottom:1px solid var(--border); }
</style>

  updateStats();
  render();
}

function applyFilter() {
  var f = document.getElementById('filterSel').value;
  filtered = [];
  for (var i = 0; i < DATA.length; i++) {
    var d = changes[i] || DATA[i];
    var st = d.st || DATA[i].st;
    if (f === 'all') filtered.push(i);
    else if (f === 'ok' && st === 'OK') filtered.push(i);
    else if (f === 'err' && st !== 'OK' && !changes[i]) filtered.push(i);
    else if (f === 'fixed' && changes[i]) filtered.push(i);
  }
  current = 0;
  // Sort by Lagerplatz for systematic checking
  filtered.sort(function(a,b) {
    var la = (changes[a] || DATA[a]).l || '';
    var lb = (changes[b] || DATA[b]).l || '';
    return la.localeCompare(lb);
  });
  updateJump();
  render();
}

function updateJump() {
  var sel = document.getElementById('jumpSel');
  sel.innerHTML = '';
  for (var i = 0; i < filtered.length; i++) {
    var idx = filtered[i];
    var o = document.createElement('option');
    o.value = i;
    o.textContent = (idx+1);
    sel.appendChild(o);
  }
}

function jumpTo(val) { current = parseInt(val) || 0; render(); }

function go(dir) {
  current += dir;
  if (current < 0) current = filtered.length - 1;
  if (current >= filtered.length) current = 0;
  render();
}

function getItem(idx) {
  return changes[idx] ? Object.assign({}, DATA[idx], changes[idx]) : DATA[idx];
}

function render() {
  if (filtered.length === 0) { document.getElementById('cardTitle').textContent = 'Keine Positionen'; return; }
  var idx = filtered[current];
  var d = getItem(idx);
  document.getElementById('posInfo').textContent = (current+1) + ' / ' + filtered.length + ' (Pos ' + d.p + ')';
  document.getElementById('jumpSel').value = current;

  var card = document.getElementById('mainCard');
  var isOk = d.st === 'OK';
  var isFixed = !!changes[idx];
  card.className = 'card ' + (isFixed ? 'ok' : (isOk ? 'ok' : 'err'));

  document.getElementById('cardTitle').textContent = d.n || d.fs || d.es || '(unbekannt)';
  var badge = document.getElementById('cardBadge');
  if (isFixed) { badge.textContent = 'KORRIGIERT'; badge.className = 'card-badge badge-fixed'; }
  else if (isOk) { badge.textContent = 'OK'; badge.className = 'card-badge badge-ok'; }
  else { badge.textContent = 'OFFEN'; badge.className = 'card-badge badge-err'; }

  document.getElementById('fLager').value = d.l || '';
  document.getElementById('fMenge').value = d.m || '';
  document.getElementById('fFnskuScan').value = d.fs || '';
  document.getElementById('fEanScan').value = d.es || '';
  document.getElementById('fAsin').value = d.a || '';
  document.getElementById('fEan').value = d.e || '';
  document.getElementById('fFnsku').value = d.f || '';
  document.getElementById('fEk').value = d.ek || '';
  document.getElementById('fName').value = d.n || '';
  document.getElementById('fSkuAmz').value = d.sa || '';
  document.getElementById('fSkuKl').value = d.sk || '';
  document.getElementById('fErfasser').value = (d.er || '') + ' | ' + (d.d || '') + ' ' + (d.u || ''); document.getElementById('fBemerkung').value = d.bm || '';

  // Highlight changed fields
  var fields = ['fAsin','fEan','fFnsku','fEk','fName','fSkuAmz','fSkuKl','fMenge'];
  var keys = ['a','e','f','ek','n','sa','sk','m'];
  for (var i = 0; i < fields.length; i++) {
    var el = document.getElementById(fields[i]);
    var orig = DATA[idx][keys[i]] || '';
    var curr = d[keys[i]] || '';
    el.className = (String(orig) !== String(curr)) ? 'changed' : '';
  }

  // Links
  var code = d.fs || d.es || d.a || '';
  var links = '';
  if (d.a) links += '<a href="https://www.amazon.de/dp/' + d.a + '" target="_blank" class="link-amz">Amazon öffnen</a>';
  if (d.fs) links += '<a href="https://sellercentral.amazon.de/myinventory?searchTerm=' + d.fs + '" target="_blank" class="link-amz">Seller Central FNSKU</a>';
  if (d.e) links += '<a href="https://www.kaufland.de/s/?search_value=' + d.e + '" target="_blank" class="link-kl">Kaufland suchen</a>';
  document.getElementById('linkBar').innerHTML = links;
}

function saveCurrentPos() {
  var idx = filtered[current];
  var d = DATA[idx];
  var c = {
    a: document.getElementById('fAsin').value.trim(),
    e: document.getElementById('fEan').value.trim(),
    f: document.getElementById('fFnsku').value.trim(),
    ek: parseFloat(document.getElementById('fEk').value) || 0,
    n: document.getElementById('fName').value.trim(),
    sa: document.getElementById('fSkuAmz').value.trim(),
    sk: document.getElementById('fSkuKl').value.trim(), bm: document.getElementById('fBemerkung').value.trim(),
    m: parseInt(document.getElementById('fMenge').value) || 0,
    st: document.getElementById('fAsin').value.trim() ? 'OK' : d.st
  };
  // Check if anything changed
  var hasChange = false;
  for (var k in c) { if (String(c[k]) !== String(d[k] || '')) { hasChange = true; break; } }
  if (hasChange) {
    c.w = c.ek * c.m;
    changes[idx] = c;
    localStorage.setItem('inv_check_changes', JSON.stringify(changes));
    // Auto-sync to Supabase
    if (sb) {
      sb.from('products').upsert(
        Object.values(changes).filter(function(c){return c.a;}).map(function(c){
          return {asin:c.a,ean:c.e||null,fnsku:c.f||null,sku:c.sa||null,title:c.n||null,ek_netto:c.ek||null};
        }), {onConflict:'asin'}
      ).then(function(r){ if(!r.error) addLog('Auto-Sync: Supabase aktualisiert'); });
    }
    addLog('Pos ' + d.p + ' korrigiert: ' + (c.a || c.n || '?'));
  }
  updateStats();
  render();
}

// Auto-save on field change
document.addEventListener('change', function(e) {
  if (e.target.closest('.field')) saveCurrentPos();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && e.target.closest('.field')) { saveCurrentPos(); go(1); }
  if (e.key === 'ArrowRight' && e.altKey) go(1);
  if (e.key === 'ArrowLeft' && e.altKey) go(-1);
});

function saveAll() {
  localStorage.setItem('inv_check_changes', JSON.stringify(changes));
  var count = Object.keys(changes).length;
  document.getElementById('saveStatus').innerHTML = '<span style="color:var(--green)">✓ ' + count + ' Korrekturen gespeichert</span>';
  setTimeout(function() { document.getElementById('saveStatus').textContent = ''; }, 3000);
  // Supabase sync
  if (sb) {
    var products = [];
    for (var idx in changes) {
      var c = changes[idx];
      if (c.a) products.push({asin:c.a, ean:c.e||null, fnsku:c.f||null, sku:c.sa||null, title:c.n||null, ek_netto:c.ek||null});
    }
    if (products.length > 0) {
      sb.from('products').upsert(products, {onConflict:'asin'}).then(function(r) {
        if (r.error) addLog('Supabase Fehler: ' + r.error.message);
        else addLog('Supabase: ' + products.length + ' Produkte synchronisiert');
      });
    }
  }
}

function exportExcel() {
  var rows = [['Pos','Lagerplatz','FNSKU_Scan','EAN_Scan','ASIN','Produktname','EAN','FNSKU','SKU_Amazon','SKU_Kaufland','EK_netto','Menge','Wert_netto','Erfasser','Datum','Uhrzeit','Status']];
  for (var i = 0; i < DATA.length; i++) {
    var d = getItem(i);
    rows.push([d.p,d.l,d.fs,d.es,d.a,d.n,d.e,d.f,d.sa,d.sk,d.ek,d.m,d.ek*d.m,d.er,d.d,d.u,changes[i]?'KORRIGIERT':d.st,d.bm||'']);
  }
  var ws = XLSX.utils.aoa_to_sheet(rows);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Inventur');
  XLSX.writeFile(wb, 'Inventur_korrigiert_' + new Date().toISOString().split('T')[0] + '.xlsx');
}

function updateStats() {
  var ok = 0, err = 0, fixed = Object.keys(changes).length;
  for (var i = 0; i < DATA.length; i++) {
    var d = getItem(i);
    if (d.st === 'OK' || changes[i]) ok++; else err++;
  }
  document.getElementById('statOk').textContent = ok + ' OK';
  document.getElementById('statErr').textContent = err + ' Offen';
  document.getElementById('statAll').textContent = DATA.length + ' | ' + fixed + ' korrigiert';
}

function addLog(msg) {
  var div = document.getElementById('logDiv');
  var time = new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  div.innerHTML = '<div class="log-entry">' + time + ' ' + msg + '</div>' + div.innerHTML;
}

init();
</script>
</body>
</html>
